<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kixo for X</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; width: 320px; padding: 16px; background: #0a0b0c; color: #ededed; font: 14px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
      p { margin: 0 0 12px; color: #a1a1aa; font-size: 12px; }
      label { display: block; margin-bottom: 6px; color: #a1a1aa; font-size: 12px; }
      input { box-sizing: border-box; width: 100%; height: 36px; padding: 0 10px; border: 1px solid #27272a; border-radius: 8px; background: #111214; color: #ededed; }
      button { margin-top: 10px; height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: #ededed; color: #0a0b0c; font-weight: 500; cursor: pointer; }
      #saved { margin-left: 8px; color: #34d399; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Kixo for X</h1>
    <p>Adds a Kixo button to every $cashtag and coin address on X. It only adds links: it never posts or reads anything private.</p>
    <label for="site">Kixo address</label>
    <input id="site" type="url" placeholder="https://kixo.trade" />
    <button id="save" type="button">Save</button><span id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>
