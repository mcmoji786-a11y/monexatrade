# Netlify settings for the Kixo waitlist (base directory: apps/waitlist).
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runs the Next.js server parts (API routes, the share card) as Netlify functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
